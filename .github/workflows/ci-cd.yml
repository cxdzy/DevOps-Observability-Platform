name: CI/CD Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'sample-service/**'
      - '.github/workflows/ci-cd.yml'
  # Used by the n8n rollback workflow (Phase 5c) to redeploy a previous image.
  workflow_dispatch:
    inputs:
      rollback_image:
        description: 'Full image reference to redeploy, for example ghcr.io/<owner>/fyp-sample-service:<sha>'
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fyp-sample-service

jobs:
  test:
    name: Build and Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sample-service/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./sample-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Verify Tailscale connectivity
        run: |
          set -euo pipefail
          tailscale status
          tailscale ping --timeout=10s "${{ secrets.VPS_HOST }}"
          nc -vz -w 10 "${{ secrets.VPS_HOST }}" 22

      - name: Deploy via SSH (over Tailscale)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Remember the image that is running now. It is the rollback target if this deployment goes wrong.
            PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' sample-service 2>/dev/null || true)
            echo "previous image: ${PREV_IMAGE:-none}"
            docker pull ${{ needs.build-and-push.outputs.image_tag }}
            docker stop sample-service || true
            docker rm sample-service || true
            docker run -d \
              --name sample-service \
              --restart unless-stopped \
              --network fyp-observability_obs-net \
              -p 127.0.0.1:4000:4000 \
              ${{ needs.build-and-push.outputs.image_tag }}
            docker image prune -f
            # Record this deployment so the anomaly worker knows a deployment just happened.
            # Written from inside the VPS (InfluxDB listens on 127.0.0.1:8086). A failure here
            # never fails the deployment.
            curl -sS -m 10 --fail -XPOST 'http://127.0.0.1:8086/write?db=prometheus' \
              --data-binary "deployment_event,container_name=sample-service,branch=master,source=ci commit_sha=\"${{ github.sha }}\",pipeline_run_id=\"${{ github.run_id }}\",previous_image=\"${PREV_IMAGE}\",is_recent=true" \
              && echo "deployment event recorded" || echo "WARNING: could not record deployment event"

  rollback:
    name: Roll back to a previous image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the image reference
        env:
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
        run: |
          set -euo pipefail
          # Only an image from this project's own registry path may be redeployed.
          expected_prefix="${{ env.IMAGE_NAME }}:"
          case "$ROLLBACK_IMAGE" in
            "$expected_prefix"*) ;;
            *) echo "Refusing: image must start with $expected_prefix"; exit 1 ;;
          esac
          tag="${ROLLBACK_IMAGE#"$expected_prefix"}"
          if ! [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Refusing: tag contains unexpected characters"; exit 1
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Roll back via SSH (over Tailscale)
        uses: appleboy/ssh-action@v1.2.0
        env:
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ROLLBACK_IMAGE
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "$ROLLBACK_IMAGE"
            docker stop sample-service || true
            docker rm sample-service || true
            docker run -d \
              --name sample-service \
              --restart unless-stopped \
              --network fyp-observability_obs-net \
              -p 127.0.0.1:4000:4000 \
              "$ROLLBACK_IMAGE"
            docker image prune -f
            # No deployment_event is written here on purpose: the worker treats every deployment_event
            # as a recent deployment, so a rollback marker could trigger tier 3 again. n8n logs the
            # rollback in remediation_action.
