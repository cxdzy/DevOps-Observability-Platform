global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # node-exporter runs in host network mode, reached via the Docker host gateway
  - job_name: node-exporter
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

# Long-term copy of every metric into InfluxDB (ML training dataset)
remote_write:
  - url: http://influxdb:8086/api/v1/prom/write?db=prometheus
