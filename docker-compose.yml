services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - obs-net

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - INFLUXDB_DB=prometheus
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - obs-net

  postgres:
    image: postgres:16-alpine
    container_name: fyp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - fyp-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - obs-net

  mlflow:
    build:
      context: ./mlflow
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Same absolute path on the host and in the container. The training script runs on
      # the host and writes model files straight to this path, so the MLflow server must see them.
      - /mlflow/artifacts:/mlflow/artifacts
    depends_on:
      - postgres
    networks:
      - obs-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=1m
    # Hard cap: if a model is too big, only this container is OOM-killed.
    # memswap_limit equal to mem_limit disables swap for this container.
    mem_limit: 1600m
    memswap_limit: 1600m
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - obs-net

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker
    restart: unless-stopped
    environment:
      - INFLUXDB_HOST=influxdb
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GROUND_TRUTH_LOG=/data/ground_truth_log.jsonl
    volumes:
      # Same absolute path as in the mlflow container, because models are loaded from the artifact store.
      - /mlflow/artifacts:/mlflow/artifacts
      # The injector's ground truth log (labels for the nightly retraining), read-only.
      - ./scripts/ground_truth_log.jsonl:/data/ground_truth_log.jsonl:ro
    # Raised from 512m: the nightly retraining loads a week of metrics.
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      - influxdb
      - mlflow
    networks:
      - obs-net

  explainer:
    build:
      context: .
      dockerfile: explainer/Dockerfile
    container_name: explainer
    restart: unless-stopped
    environment:
      - INFLUXDB_HOST=influxdb
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - CHROMA_PATH=/data/chroma
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - explainer-data:/data
      - explainer-cache:/root/.cache
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - influxdb
      - ollama
      - postgres
    networks:
      - obs-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - influxdb
      - cadvisor
    networks:
      - obs-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - influxdb
    networks:
      - obs-net

networks:
  obs-net:
    driver: bridge

volumes:
  ollama-models:
  fyp-postgres-data:
  influxdb-data:
  prometheus-data:
  grafana-data:
  explainer-data:
  explainer-cache:
